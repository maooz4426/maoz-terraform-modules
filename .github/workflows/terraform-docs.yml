name: terraform-docs

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Generate terraform docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          find-dir: ./
          output-method: inject
          args: --hide-empty
          git-push: "true"
