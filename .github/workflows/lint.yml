name: Lint

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
jobs: 
  lint:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: maooz4426/maoz-workflows/terraform-fmt@main
        with:
          head_ref: ${{ github.head_ref }} 
